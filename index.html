<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>切込寸法計算 iPad 11インチ最適化版</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="切込">
    <link rel="icon" type="image/png" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-180.png">
    
    <style>
        :root {
            --theme-color: #ff9f0a;
            --ios-bg: #000000;
            --ios-card: #1c1c1e;
            --ios-border: #2c2c2e;
            --ios-orange: #ff9f0a;
            --ios-silver: #c7c7cc;
            --ios-silver-dark: #8e8e93;
            --unfocused-border: #3a3a3c;
        }

        .mode-height { --theme-color: #e67600; --ios-orange: #e67600; }
        .mode-history { --theme-color: #0a84ff; --ios-orange: #0a84ff; }

        * { 
            box-sizing: border-box; 
            -webkit-text-size-adjust: 100%; 
            -webkit-tap-highlight-color: transparent; 
            touch-action: manipulation;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--ios-bg);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            overscroll-behavior: none;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .main-container { 
            width: 100%; 
            max-width: 1194px; 
            display: flex; 
            flex-direction: column; 
            flex-grow: 1; 
            padding: 0 16px;
        }

        .app-top-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 8px 10px; 
            width: 100%; 
        }
        .app-top-bar .title { 
            font-size: 20px; 
            font-weight: 700; 
            color: #ffffff; 
            letter-spacing: -0.01em;
            display: inline-flex;
            align-items: center;
        }
        .app-top-bar .company { 
            font-size: 13px; 
            font-weight: 600; 
            color: var(--ios-silver); 
            opacity: 0.85; 
            letter-spacing: 0.05em;
        }

        .mode-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 18px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            background: #242428;
            color: #ffffff;
            border: 1.5px solid #3a3a3c;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .mode-toggle-btn:active {
            transform: scale(0.96);
            background: #323236;
        }
        .mode-toggle-btn.in-history {
            background: #172a40;
            color: #5ac8fa;
            border-color: #0a84ff;
        }

        .calc-split-layout,
        .history-split-layout {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
            align-items: start;
            padding-bottom: 24px;
        }

        .split-pane {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #141416;
            border-radius: 20px;
            padding: 16px;
            border: 1px solid #2a2a2c;
        }

        .pane-header-badge {
            display: inline-flex;
            align-items: center;
            font-size: 14px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 8px;
            width: fit-content;
        }
        .badge-side { background: rgba(255, 159, 10, 0.15); color: #ff9f0a; border: 1px solid rgba(255, 159, 10, 0.35); }
        .badge-height { background: rgba(230, 118, 0, 0.15); color: #ff9f0a; border: 1px solid rgba(230, 118, 0, 0.35); }

        .cell-grid { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); 
            background: var(--ios-border); 
            gap: 1px; 
            border-radius: 14px 14px 0 0; 
            overflow: hidden; 
            border: 1px solid var(--ios-border); 
            border-bottom: none; 
        }
        .calc-cell { 
            background: #19191b; 
            padding: 8px 12px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            position: relative; 
            grid-column: span 3; 
            border: 0.5px solid var(--unfocused-border); 
            min-height: 64px; 
            cursor: pointer;
            transition: background 0.15s;
        }
        .span-2 { grid-column: span 2 !important; }
        .span-4 { grid-column: span 4 !important; }
        .calc-cell.focused { 
            background: #242428; 
            box-shadow: inset 0 0 0 2.5px var(--ios-orange) !important; 
            border-color: var(--ios-orange); 
            z-index: 10; 
        }
        .input-label-left { 
            font-size: 13px; 
            font-weight: 600; 
            color: #d1d1d6; 
            margin-bottom: 2px; 
        }
        .input-value { 
            font-size: 32px; 
            font-weight: 700; 
            color: #ffffff; 
            text-align: center; 
            line-height: 1.1; 
            font-feature-settings: "tnum";
        }
        .input-value-lg { font-size: 34px; }

        .keypad-container { 
            display: flex; 
            flex-direction: column; 
            gap: 1px; 
            background: var(--ios-border); 
            border-radius: 0 0 14px 14px; 
            overflow: hidden; 
            border: 1px solid var(--ios-border); 
        }
        .keypad-row { 
            display: grid; 
            gap: 1px; 
            background: var(--ios-border); 
        }
        .row-top { grid-template-columns: repeat(6, 1fr); }
        .row-bottom { grid-template-columns: repeat(9, 1fr); }
        
        .key-btn { 
            background: #222225; 
            color: #ffffff; 
            height: 56px; 
            font-size: 22px; 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: background 0.1s, transform 0.05s; 
            border: none; 
            outline: none; 
            padding: 0; 
            user-select: none;
        }
        .key-btn:active { 
            background: #3c3c40; 
            transform: scale(0.97); 
        }

        .key-fn { height: 56px; font-size: 16px; font-weight: 700; }
        .key-fn.clear-btn { background: #2c2c30; color: #f2f2f7; }
        .key-fn.clear-btn:active { background: #44444a; }
        .key-fn.save-btn { 
            background: #3a2612; 
            color: #ff9f0a; 
            border: 1px solid rgba(255, 159, 10, 0.4); 
        }
        .key-fn.save-btn:active { background: #52361a; }
        .key-fn.history-btn { 
            background: #172a40; 
            color: #5ac8fa; 
            border: 1px solid rgba(10, 132, 255, 0.4); 
        }
        .key-fn.history-btn:active { background: #223c5b; }

        .result-area { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            margin-top: 4px; 
        }
        .dir-switch-bar { 
            background-color: #1c1c1e; 
            padding: 3px; 
            border-radius: 10px; 
            display: inline-flex; 
            border: 1px solid #333;
        }
        .dir-button { 
            font-size: 14px; 
            color: #aeaeb2; 
            padding: 8px 18px; 
            border: 2px solid transparent; 
            font-weight: 600; 
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .dir-active { 
            background-color: #3a3a3c; 
            color: var(--theme-color); 
            border-color: var(--theme-color); 
        }
        .preview-header-row {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .preview-header-row.placeholder {
            visibility: hidden;
        }

        .history-view-container { 
            background: #141416; 
            border-radius: 20px; 
            border: 1px solid #2a2a2c; 
            overflow: hidden; 
            box-shadow: 0 6px 24px rgba(0,0,0,0.5); 
            padding: 16px;
        }
        .history-label-main { font-size: 16px !important; font-weight: 700; color: #ffffff; }
        .history-item { 
            background: #242428; 
            border: 1.5px solid #3a3a3c; 
            margin-bottom: 10px; 
            border-radius: 14px; 
            padding: 12px 16px;
            transition: all 0.15s; 
            cursor: pointer; 
        }
        .history-item.checked { border-color: var(--theme-color); }
        .history-item.preview-active { 
            border-color: #0a84ff !important; 
            background: #2c2f38; 
            box-shadow: 0 0 14px rgba(10, 132, 255, 0.35); 
        }

        #toast { 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            background: rgba(10, 132, 255, 0.95); 
            color: white; 
            padding: 18px 36px; 
            border-radius: 16px; 
            font-size: 18px;
            font-weight: 700; 
            opacity: 0; 
            z-index: 10000; 
            transition: 0.25s ease; 
            pointer-events: none; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }
        #toast.show { opacity: 1; }
        .hidden { display: none !important; }

        @media (max-width: 820px) {
            .calc-split-layout,
            .history-split-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body id="mainBody">

    <div id="toast">コピーしました</div>

    <div class="main-container" id="mainApp">
        <!-- ヘッダー -->
        <div class="app-top-bar">
            <div class="flex items-center gap-3">
                <span class="title">切込寸法計算 <span class="text-xs font-normal text-[#ff9f0a] border border-[#ff9f0a]/40 rounded-full px-2 py-0.5 ml-2">iPad 11"</span></span>
            </div>

            <!-- 切り替えトグルボタン -->
            <button id="mainModeToggleBtn" type="button" class="mode-toggle-btn" onclick="toggleMode()">
                <svg id="toggleIconCalc" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <svg id="toggleIconHistory" class="w-4 h-4 text-[#ff9f0a]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span id="toggleButtonText">履歴管理</span>
                <span id="toggleHistoryCountBadge" class="bg-[#ff9f0a] text-black text-xs font-black px-1.5 py-0.5 rounded-full min-w-[18px] text-center">0</span>
            </button>

            <span class="company">KYOWA ROOF</span>
        </div>
        
        <!-- 計算画面 -->
        <div id="viewCalc">
            <div class="calc-split-layout">
                <!-- 左ペイン: 横切込 -->
                <div class="split-pane">
                    <div class="flex items-center justify-between">
                        <span class="pane-header-badge badge-side">横 切込</span>
                        <span class="text-xs text-[#aeaeb2]">働き幅・開口部</span>
                    </div>

                    <div id="sideInputs">
                        <div class="cell-grid">
                            <div class="calc-cell" onclick="focusInput('side_a')">
                                <span class="input-label-left">働き幅 (＠)</span>
                                <div id="display-side_a" class="input-value">0</div>
                            </div>
                            <div class="calc-cell" onclick="focusInput('side_l2')">
                                <span class="input-label-left">横幅 (開口部)</span>
                                <div id="display-side_l2" class="input-value">0</div>
                            </div>
                            <div class="calc-cell span-2" onclick="focusInput('side_no')">
                                <span class="input-label-left text-center">横 No.</span>
                                <div id="display-side_no" class="input-value">1</div>
                            </div>
                            <div class="calc-cell span-4" onclick="focusInput('side_l1')">
                                <span class="input-label-left">寸法 (張方向↔対象)</span>
                                <div id="display-side_l1" class="input-value input-value-lg">0</div>
                            </div>
                        </div>
                    </div>

                    <!-- 横切込 テンキー -->
                    <div id="keypadArea" class="keypad-container keypad-left">
                        <div class="keypad-row row-top">
                            <button type="button" class="key-btn key-fn history-btn" onclick="toggleMode('history')">履歴</button>
                            <button type="button" class="key-btn key-fn clear-btn" onclick="pressSideKey('allClear')">AC</button>
                            <button type="button" class="key-btn" onclick="pressSideKey('00')">00</button>
                            <button type="button" class="key-btn" onclick="pressSideKey('0')">0</button>
                            <button type="button" class="key-btn key-fn clear-btn" onclick="pressSideKey('clear')">C</button>
                            <button type="button" class="key-btn key-fn save-btn" onclick="pressSideKey('enter')">保存</button>
                        </div>
                        <div class="keypad-row row-bottom">
                            <button type="button" class="key-btn" onclick="pressSideKey('1')">1</button>
                            <button type="button" class="key-btn" onclick="pressSideKey('2')">2</button>
                            <button type="button" class="key-btn" onclick="pressSideKey('3')">3</button>
                            <button type="button" class="key-btn" onclick="pressSideKey('4')">4</button>
                            <button type="button" class="key-btn" onclick="pressSideKey('5')">5</button>
                            <button type="button" class="key-btn" onclick="pressSideKey('6')">6</button>
                            <button type="button" class="key-btn" onclick="pressSideKey('7')">7</button>
                            <button type="button" class="key-btn" onclick="pressSideKey('8')">8</button>
                            <button type="button" class="key-btn" onclick="pressSideKey('9')">9</button>
                        </div>
                    </div>

                    <div id="resultArea" class="hidden result-area">
                        <div id="directionToggle" class="preview-header-row">
                            <div class="dir-switch-bar gap-1">
                                <button type="button" onclick="setCalcDir('LtoR')" id="btnLtoR" class="dir-button dir-active">左←右 (LtoR)</button>
                                <button type="button" onclick="setCalcDir('RtoL')" id="btnRtoL" class="dir-button">左→右 (RtoL)</button>
                            </div>
                        </div>
                        <div class="bg-[#000] rounded-2xl border border-[#333] shadow-xl overflow-hidden p-2 relative cursor-pointer" onclick="openZoomModal('svgContainer')">
                            <div id="svgContainer" class="w-full bg-[#000] rounded-xl overflow-hidden"></div>
                        </div>
                        <div id="numericResults" class="grid gap-3"></div>
                    </div>
                </div>

                <!-- 右ペイン: 縦切込 -->
                <div class="split-pane">
                    <div class="flex items-center justify-between">
                        <span class="pane-header-badge badge-height">縦 切込</span>
                        <span class="text-xs text-[#aeaeb2]">全長・開口部</span>
                    </div>

                    <div id="heightInputs">
                        <div class="cell-grid">
                            <div class="calc-cell" onclick="focusInput('h_total')">
                                <span class="input-label-left">全長 (L)</span>
                                <div id="display-h_total" class="input-value">0</div>
                            </div>
                            <div class="calc-cell" onclick="focusInput('h_l2')">
                                <span class="input-label-left">縦幅 (開口部)</span>
                                <div id="display-h_l2" class="input-value">0</div>
                            </div>
                            <div class="calc-cell span-2" onclick="focusInput('h_no')">
                                <span class="input-label-left text-center">縦 No.</span>
                                <div id="display-h_no" class="input-value">1</div>
                            </div>
                            <div class="calc-cell span-4" onclick="focusInput('h_l1')">
                                <span class="input-label-left">寸法 (下↑対象)</span>
                                <div id="display-h_l1" class="input-value input-value-lg">0</div>
                            </div>
                        </div>
                    </div>

                    <!-- 縦切込 テンキー -->
                    <div class="keypad-container keypad-right">
                        <div class="keypad-row row-top">
                            <button type="button" class="key-btn key-fn history-btn" onclick="toggleMode('history')">履歴</button>
                            <button type="button" class="key-btn key-fn clear-btn" onclick="pressHeightKey('allClear')">AC</button>
                            <button type="button" class="key-btn" onclick="pressHeightKey('00')">00</button>
                            <button type="button" class="key-btn" onclick="pressHeightKey('0')">0</button>
                            <button type="button" class="key-btn key-fn clear-btn" onclick="pressHeightKey('clear')">C</button>
                            <button type="button" class="key-btn key-fn save-btn" onclick="pressHeightKey('enter')">保存</button>
                        </div>
                        <div class="keypad-row row-bottom">
                            <button type="button" class="key-btn" onclick="pressHeightKey('1')">1</button>
                            <button type="button" class="key-btn" onclick="pressHeightKey('2')">2</button>
                            <button type="button" class="key-btn" onclick="pressHeightKey('3')">3</button>
                            <button type="button" class="key-btn" onclick="pressHeightKey('4')">4</button>
                            <button type="button" class="key-btn" onclick="pressHeightKey('5')">5</button>
                            <button type="button" class="key-btn" onclick="pressHeightKey('6')">6</button>
                            <button type="button" class="key-btn" onclick="pressHeightKey('7')">7</button>
                            <button type="button" class="key-btn" onclick="pressHeightKey('8')">8</button>
                            <button type="button" class="key-btn" onclick="pressHeightKey('9')">9</button>
                        </div>
                    </div>

                    <div id="heightResultArea" class="hidden result-area">
                        <div class="preview-header-row placeholder" aria-hidden="true">
                            <div class="dir-switch-bar gap-1">
                                <button type="button" class="dir-button">左←右</button>
                                <button type="button" class="dir-button">左→右</button>
                            </div>
                        </div>
                        <div class="bg-[#000] rounded-2xl border border-[#333] shadow-xl overflow-hidden p-2 relative cursor-pointer" onclick="openZoomModal('heightSvgContainer')">
                            <div id="heightSvgContainer" class="w-full bg-[#000] rounded-xl overflow-hidden"></div>
                        </div>
                        <div id="heightNumericResults" class="grid gap-3"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="viewHistory" class="hidden">
            <div class="history-split-layout">
                <div class="split-pane">
                    <div class="history-view-container">
                        <div id="sideHistoryPreviewContainer" class="mb-4 hidden">
                            <div class="bg-[#000] rounded-2xl border border-[#333] shadow-xl overflow-hidden p-2 mb-2 relative cursor-pointer" onclick="openZoomModal('sideHistoryPreviewSvg')">
                                <div id="sideHistoryPreviewSvg" class="w-full bg-[#000] rounded-xl overflow-hidden"></div>
                            </div>
                        </div>

                        <div class="flex items-center justify-between mb-4 p-3 bg-[#1f1f23] rounded-xl border border-[#333]">
                            <h2 class="history-label-main flex items-center gap-2">
                                <span class="w-2.5 h-2.5 rounded-full bg-[#ff9f0a]"></span>
                                横 切込履歴
                            </h2>
                            <button type="button" onclick="openConfirm('category', '横')" class="bg-[#3a3a3c] hover:bg-[#4a4a4e] text-white text-xs font-bold px-4 py-2 rounded-lg transition-all">削除</button>
                        </div>

                        <div id="sideHistoryList" class="space-y-3"></div>
                    </div>
                </div>

                <div class="split-pane">
                    <div class="history-view-container">
                        <div id="heightHistoryPreviewContainer" class="mb-4 hidden">
                            <div class="bg-[#000] rounded-2xl border border-[#333] shadow-xl overflow-hidden p-2 mb-2 relative cursor-pointer" onclick="openZoomModal('heightHistoryPreviewSvg')">
                                <div id="heightHistoryPreviewSvg" class="w-full bg-[#000] rounded-xl overflow-hidden"></div>
                            </div>
                        </div>

                        <div class="flex items-center justify-between mb-4 p-3 bg-[#1f1f23] rounded-xl border border-[#333]">
                            <h2 class="history-label-main flex items-center gap-2">
                                <span class="w-2.5 h-2.5 rounded-full bg-[#e67600]"></span>
                                縦 切込履歴
                            </h2>
                            <div class="flex gap-2 items-center">
                                <button type="button" onclick="openConfirm('all')" class="bg-[#ff453a] hover:bg-[#ff3b30] text-white text-xs font-bold px-3 py-2 rounded-lg transition-all">一括削除</button>
                                <button type="button" onclick="openConfirm('category', '縦')" class="bg-[#3a3a3c] hover:bg-[#4a4a4e] text-white text-xs font-bold px-4 py-2 rounded-lg transition-all">削除</button>
                            </div>
                        </div>

                        <div id="heightHistoryList" class="space-y-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="customConfirmModal" class="hidden fixed inset-0 flex items-center justify-center p-6" style="background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 99999;">
        <div class="bg-[#1c1c1e] w-full max-w-md rounded-3xl p-8 border border-[#3a3a3c] text-center shadow-2xl">
            <h4 class="text-xl font-bold text-white mb-4">確認</h4>
            <p id="confirmMessage" class="text-[#d1d1d6] text-base mb-8 leading-relaxed"></p>
            <div class="flex gap-4">
                <button type="button" onclick="document.getElementById('customConfirmModal').classList.add('hidden')" class="flex-1 bg-[#2c2c2e] hover:bg-[#3a3a3c] text-white font-bold py-3.5 rounded-xl transition-all">キャンセル</button>
                <button type="button" onclick="executeConfirm()" class="flex-1 bg-[#ff453a] hover:bg-[#ff3b30] text-white font-bold py-3.5 rounded-xl transition-all">削除する</button>
            </div>
        </div>
    </div>

    <!-- 拡大・ピンチ・回転対応ズームモーダル -->
    <div id="zoomModal" class="hidden fixed inset-0 z-[100000] flex flex-col bg-black transition-opacity">
        <div class="absolute top-0 left-0 right-0 p-6 flex justify-end items-center z-[100010]">
            <div class="flex gap-4">
                <button type="button" class="text-white bg-white/20 hover:bg-white/30 rounded-full p-3 backdrop-blur-md transition-colors" onclick="toggleZoomRotation()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                </button>
                <button type="button" class="text-white bg-white/20 hover:bg-white/30 rounded-full p-3 backdrop-blur-md transition-colors" onclick="closeZoomModal()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
        </div>
        <div id="zoomArea" class="flex-1 w-full h-full flex items-center justify-center overflow-hidden touch-none relative">
            <img id="zoomImg" class="max-w-full max-h-full object-contain transition-transform duration-75 ease-out" alt="拡大図面" style="transform-origin: center;">
        </div>
    </div>

    <script>
        const STORAGE_KEY_STATE = 'cutting_calc_ipad_state';
        const STORAGE_KEY_HISTORY = 'cutting_calc_ipad_history';

        let currentMode = 'calc';
        let focusedSideInputId = 'side_l1';
        let focusedHeightInputId = 'h_l1';
        let isOverwriteModeSide = true;
        let isOverwriteModeHeight = true;
        let calcDirection = 'LtoR';
        let historyData = [];
        
        let currentSideResult = null;
        let currentHeightResult = null;
        let activePreviewId = null;

        const inputs = {
            side_a: '', side_l2: '', side_l1: '', side_no: '1',
            h_total: '', h_l2: '', h_l1: '', h_no: '1'
        };

        function persist() {
            try {
                localStorage.setItem(STORAGE_KEY_STATE, JSON.stringify({ inputs, currentMode, calcDirection }));
                localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(historyData));
            } catch (e) {
                console.warn("Storage save failed:", e);
            }
        }

        function hydrate() {
            try {
                const savedState = localStorage.getItem(STORAGE_KEY_STATE);
                if (savedState) {
                    const data = JSON.parse(savedState);
                    if (data.inputs) Object.assign(inputs, data.inputs);
                    currentMode = data.currentMode === 'history' ? 'history' : 'calc';
                    calcDirection = data.calcDirection || 'LtoR';
                }
                const savedHistory = localStorage.getItem(STORAGE_KEY_HISTORY);
                if (savedHistory) {
                    historyData = JSON.parse(savedHistory);
                }
            } catch (e) {
                console.warn("Hydration error:", e);
            }
            
            updateDisplay();
            focusedSideInputId = focusedSideInputId || 'side_l1';
            focusedHeightInputId = focusedHeightInputId || 'h_l1';
            updateModeUI();
            calculate();
            renderHistory();
            updateHistoryCountBadge();
        }

        function toggleMode(targetMode) {
            if (targetMode) {
                currentMode = targetMode;
            } else {
                currentMode = (currentMode === 'history') ? 'calc' : 'history';
            }
            updateModeUI();
            persist();
        }

        function updateHistoryCountBadge() {
            const countBadge = document.getElementById('toggleHistoryCountBadge');
            if (countBadge) {
                countBadge.innerText = historyData.length;
            }
        }

        function updateModeUI() {
            const isHistory = (currentMode === 'history');
            const body = document.getElementById('mainBody');
            body.classList.toggle('mode-history', isHistory);

            document.getElementById('viewCalc').classList.toggle('hidden', isHistory);
            document.getElementById('viewHistory').classList.toggle('hidden', !isHistory);

            const btn = document.getElementById('mainModeToggleBtn');
            const btnText = document.getElementById('toggleButtonText');
            const iconCalc = document.getElementById('toggleIconCalc');
            const iconHistory = document.getElementById('toggleIconHistory');
            const countBadge = document.getElementById('toggleHistoryCountBadge');

            if (isHistory) {
                btn.classList.add('in-history');
                btnText.innerText = "切込計算に戻る";
                iconCalc.classList.remove('hidden');
                iconHistory.classList.add('hidden');
                countBadge.classList.add('hidden');
                renderHistory();
                const firstSide = historyData.find(d => d.mode === '横');
                const firstHeight = historyData.find(d => d.mode === '縦');
                if (firstSide) previewHistoryItem(firstSide.id, false);
                if (firstHeight) previewHistoryItem(firstHeight.id, false);
            } else {
                btn.classList.remove('in-history');
                btnText.innerText = "履歴管理";
                iconCalc.classList.add('hidden');
                iconHistory.classList.remove('hidden');
                countBadge.classList.remove('hidden');
                updateHistoryCountBadge();
                refreshFocusedHighlights();
                calculateSide();
                calculateHeight();
            }
        }

        function refreshFocusedHighlights() {
            document.querySelectorAll('.calc-cell').forEach(el => el.classList.remove('focused'));
            const sideEl = document.getElementById('display-' + focusedSideInputId);
            const heightEl = document.getElementById('display-' + focusedHeightInputId);
            if (sideEl) sideEl.parentElement.classList.add('focused');
            if (heightEl) heightEl.parentElement.classList.add('focused');
        }

        function focusInput(id) {
            document.querySelectorAll('.calc-cell').forEach(el => el.classList.remove('focused'));
            const target = document.getElementById('display-' + id);
            if (target) target.parentElement.classList.add('focused');

            if (id.startsWith('side_')) {
                focusedSideInputId = id;
                isOverwriteModeSide = true;
            } else if (id.startsWith('h_')) {
                focusedHeightInputId = id;
                isOverwriteModeHeight = true;
            }
            refreshFocusedHighlights();
        }

        function applyKeyToTarget(key, targetId, scope) {
            if (key === 'allClear') {
                if (scope === 'side') {
                    inputs.side_a = ''; inputs.side_l2 = ''; inputs.side_l1 = ''; inputs.side_no = '1';
                    isOverwriteModeSide = true;
                    currentSideResult = null;
                } else {
                    inputs.h_total = ''; inputs.h_l2 = ''; inputs.h_l1 = ''; inputs.h_no = '1';
                    isOverwriteModeHeight = true;
                    currentHeightResult = null;
                }
                showToast("リセットしました");
            } else if (key === 'clear') {
                inputs[targetId] = (targetId.endsWith('_no')) ? '1' : '';
                if (scope === 'side') isOverwriteModeSide = true;
                else isOverwriteModeHeight = true;
            } else if (key === 'enter') {
                if (scope === 'side') {
                    calculateSide();
                    saveToHistory('横');
                } else {
                    calculateHeight();
                    saveToHistory('縦');
                }
                return;
            } else {
                const overwrite = scope === 'side' ? isOverwriteModeSide : isOverwriteModeHeight;
                if (overwrite) {
                    inputs[targetId] = key;
                    if (scope === 'side') isOverwriteModeSide = false;
                    else isOverwriteModeHeight = false;
                } else {
                    inputs[targetId] = inputs[targetId].toString() + key;
                }
            }
            updateDisplay();
            calculate();
            persist();
        }

        function pressSideKey(key) {
            applyKeyToTarget(key, focusedSideInputId, 'side');
        }

        function pressHeightKey(key) {
            applyKeyToTarget(key, focusedHeightInputId, 'height');
        }

        function updateDisplay() {
            for (const key in inputs) {
                const el = document.getElementById('display-' + key);
                if (el) {
                    const val = inputs[key];
                    el.innerText = val === '' ? '0' : formatNumber(val);
                    el.style.opacity = val === '' ? '0.35' : '1';
                }
            }
        }

        function formatNumber(num) {
            if (!num && num !== 0) return "";
            const parts = num.toString().split(".");
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            return parts.join(".");
        }

        function calculate() {
            if (currentMode === 'history') return;
            calculateSide();
            calculateHeight();
        }

        function calculateSide() {
            const a = parseFloat(inputs.side_a), l2 = parseFloat(inputs.side_l2), l1 = parseFloat(inputs.side_l1);
            const resArea = document.getElementById('resultArea');
            if (isNaN(l1) || isNaN(l2) || isNaN(a) || a <= 0) { 
                resArea.classList.add('hidden'); 
                currentSideResult = null;
                return; 
            }
            let z, y;
            if (calcDirection === 'LtoR') { y = l1 % a; z = (a - ((l1 + l2) % a)) % a; }
            else { z = l1 % a; y = (a - ((l1 + l2) % a)) % a; }
            const fZ = Math.round(z * 10) / 10, fY = Math.round(y * 10) / 10;
            currentSideResult = { mode: '横', no: inputs.side_no || '-', inputs: { a, l2, l1 }, outputs: { z: fZ, y: fY }, calcDir: calcDirection };
            
            document.getElementById('numericResults').className = "grid grid-cols-2 gap-4 mt-2";
            document.getElementById('numericResults').innerHTML = `
                <div class="bg-[#1f1f23] rounded-2xl py-3 px-4 border border-[#333] text-center shadow-lg">
                    <p class="text-[14px] font-semibold text-[#d1d1d6] mb-1">左側切込</p>
                    <p class="text-[42px] font-bold text-[#0a84ff] leading-none">${formatNumber(fZ)}<span class="text-base ml-1.5 font-normal text-[#d1d1d6]">mm</span></p>
                </div>
                <div class="bg-[#1f1f23] rounded-2xl py-3 px-4 border border-[#333] text-center shadow-lg">
                    <p class="text-[14px] font-semibold text-[#d1d1d6] mb-1">右側切込</p>
                    <p class="text-[42px] font-bold text-[#30d158] leading-none">${formatNumber(fY)}<span class="text-base ml-1.5 font-normal text-[#d1d1d6]">mm</span></p>
                </div>`;
            updateSVG('side', l1, l2, a, fZ, fY, calcDirection, 'svgContainer');
            resArea.classList.remove('hidden');
        }

        function calculateHeight() {
            const t = parseFloat(inputs.h_total), l2 = parseFloat(inputs.h_l2), l1 = parseFloat(inputs.h_l1);
            const resArea = document.getElementById('heightResultArea');
            if (isNaN(t) || isNaN(l1) || isNaN(l2) || t <= 0) { 
                resArea.classList.add('hidden'); 
                currentHeightResult = null;
                return; 
            }
            const rD = l1, rU = l1 + l2, rT = t - rU;
            currentHeightResult = { mode: '縦', no: inputs.h_no || '-', inputs: { total: t, l2, l1 }, outputs: { down: rD, up: rU, top: rT } };
            
            document.getElementById('heightNumericResults').className = "grid grid-cols-3 gap-3 mt-2";
            document.getElementById('heightNumericResults').innerHTML = `
                <div class="bg-[#1f1f23] rounded-2xl py-3 border border-[#333] text-center shadow-lg">
                    <p class="text-[13px] font-semibold text-[#d1d1d6] mb-1">下 切込</p>
                    <p class="text-[32px] font-bold text-white leading-none">${formatNumber(rD)}<span class="text-xs ml-1 font-normal text-[#d1d1d6]">mm</span></p>
                </div>
                <div class="bg-[#1f1f23] rounded-2xl py-3 border border-[#333] text-center shadow-lg">
                    <p class="text-[13px] font-semibold text-[#d1d1d6] mb-1">上 切込</p>
                    <p class="text-[32px] font-bold text-[#5e5ce6] leading-none">${formatNumber(rU)}<span class="text-xs ml-1 font-normal text-[#d1d1d6]">mm</span></p>
                </div>
                <div class="bg-[#1f1f23] rounded-2xl py-3 border border-[#333] text-center shadow-lg">
                    <p class="text-[13px] font-semibold text-[#d1d1d6] mb-1">上寸法</p>
                    <p class="text-[32px] font-bold text-[#30d158] leading-none">${formatNumber(Math.round(rT*10)/10)}<span class="text-xs ml-1 font-normal text-[#d1d1d6]">mm</span></p>
                </div>`;
            updateSVG('height', t, l2, l1, rU, Math.round(rT*10)/10, null, 'heightSvgContainer');
            resArea.classList.remove('hidden');
        }

        function setCalcDir(dir) {
            calcDirection = dir;
            syncCalcDirUI();
            calculate();
            persist();
        }

        function syncCalcDirUI() {
            const btnL = document.getElementById('btnLtoR');
            const btnR = document.getElementById('btnRtoL');
            if (btnL && btnR) {
                btnL.classList.toggle('dir-active', calcDirection === 'LtoR');
                btnR.classList.toggle('dir-active', calcDirection === 'RtoL');
            }
        }

        function saveToHistory(mode) {
            const targetResult = (mode === '横') ? currentSideResult : currentHeightResult;
            if (!targetResult) {
                showToast("数値を入力してください");
                return;
            }
            const newItem = { 
                ...targetResult, 
                id: 'item-' + Date.now() + '-' + Math.floor(Math.random() * 1000), 
                createdAt: Date.now(), 
                checked: false 
            };
            historyData.unshift(newItem);
            if (historyData.length > 100) historyData = historyData.filter((d, i) => d.checked || i < 100);
            persist();
            renderHistory();
            updateHistoryCountBadge();
            showToast("履歴に保存しました");
        }

        function toggleCheck(id) {
            const item = historyData.find(d => d.id === id);
            if (item) item.checked = !item.checked;
            persist();
            renderHistory();
        }

        function deleteHistoryItem(id) {
            historyData = historyData.filter(d => d.id !== id);
            if (activePreviewId === id) {
                document.getElementById('sideHistoryPreviewContainer').classList.add('hidden');
                document.getElementById('heightHistoryPreviewContainer').classList.add('hidden');
                activePreviewId = null;
            }
            persist();
            renderHistory();
            updateHistoryCountBadge();
            showToast("削除しました");
        }

        function previewHistoryItem(id, shouldScroll = true) {
            const item = historyData.find(d => d.id === id);
            if (!item) return;
            activePreviewId = id;
            if (item.mode === '横') {
                document.getElementById('sideHistoryPreviewContainer').classList.remove('hidden');
                updateSVG('side', item.inputs.l1, item.inputs.l2, item.inputs.a, item.outputs.z, item.outputs.y, item.calcDir, 'sideHistoryPreviewSvg');
                Object.assign(inputs, { side_a: item.inputs.a.toString(), side_l2: item.inputs.l2.toString(), side_l1: item.inputs.l1.toString(), side_no: item.no.toString() });
                calcDirection = item.calcDir;
                syncCalcDirUI();
            } else {
                document.getElementById('heightHistoryPreviewContainer').classList.remove('hidden');
                updateSVG('height', item.inputs.total, item.inputs.l2, item.inputs.l1, item.outputs.up, Math.round(item.outputs.top*10)/10, null, 'heightHistoryPreviewSvg');
                Object.assign(inputs, { h_total: item.inputs.total.toString(), h_l2: item.inputs.l2.toString(), h_l1: item.inputs.l1.toString(), h_no: item.no.toString() });
            }
            updateDisplay();
            renderHistory();
            if (shouldScroll) window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function applyHistoryItem(id) { previewHistoryItem(id, true); }

        function renderHistory() {
            const sideList = document.getElementById('sideHistoryList'), heightList = document.getElementById('heightHistoryList');
            if(!sideList || !heightList) return;
            const renderItem = item => {
                const isChecked = item.checked, isPreviewing = item.id === activePreviewId, theme = item.mode === '横' ? '#ff9f0a' : '#e67600';
                const lockedSvg = '<svg class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/></svg>';
                const unlockedSvg = '<svg class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a5 5 0 00-5 5v2a2 2 0 00-2 2v5a2 2 0 002 2h10a2 2 0 002-2v-5a2 2 0 00-2-2H15V7a5 5 0 00-5-5zM8 7a2 2 0 114 0v2H8V7z" /></svg>';
                const closeSvg = '<svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>';
                let res = item.mode === '横' 
                    ? `<div class="flex justify-around pt-2 border-t border-[#333]"><div class="text-center"><p class="text-[12px] font-semibold text-[#d1d1d6]">左切込</p><p class="text-[28px] font-bold text-[#0a84ff] leading-tight">${formatNumber(item.outputs.z)}<span class="text-xs font-normal ml-1">mm</span></p></div><div class="text-center"><p class="text-[12px] font-semibold text-[#d1d1d6]">右切込</p><p class="text-[28px] font-bold text-[#30d158] leading-tight">${formatNumber(item.outputs.y)}<span class="text-xs font-normal ml-1">mm</span></p></div></div>`
                    : `<div class="grid grid-cols-3 pt-2 border-t border-[#333]"><div class="text-center"><p class="text-[12px] font-semibold text-[#d1d1d6]">下切</p><p class="text-[24px] font-bold text-white">${formatNumber(item.outputs.down)}</p></div><div class="text-center"><p class="text-[12px] font-semibold text-[#d1d1d6]">上切</p><p class="text-[24px] font-bold text-[#5e5ce6]">${formatNumber(item.outputs.up)}</p></div><div class="text-center"><p class="text-[12px] font-semibold text-[#d1d1d6]">上寸</p><p class="text-[24px] font-bold text-[#30d158]">${formatNumber(item.outputs.top)}</p></div></div>`;
                const previewClass = isPreviewing ? "preview-active" : "";
                return `<div class="history-item shadow-lg ${previewClass}" style="border-color: ${isChecked ? theme : ''}" onclick="applyHistoryItem('${item.id}')">
                    <div class="flex justify-between items-center mb-1">
                        <div class="flex items-center gap-3">
                            <button type="button" onclick="event.stopPropagation(); toggleCheck('${item.id}')" style="color: ${isChecked ? theme : '#8e8e93'}">${isChecked ? lockedSvg : unlockedSvg}</button>
                            <span class="bg-white text-black text-[12px] font-extrabold px-2.5 py-0.5 rounded-full">No.${item.no}</span>
                            <span class="text-[16px] font-semibold text-white">${item.mode==='横'?'寸法':'下寸'}: ${formatNumber(item.inputs.l1)}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span style="color: ${theme}" class="text-[13px] font-bold uppercase">${item.mode}切込</span>
                            <button type="button" onclick="event.stopPropagation(); deleteHistoryItem('${item.id}')" class="text-[#8e8e93] bg-[#2c2c2e] hover:bg-[#ff453a] hover:text-white rounded-full p-1.5 transition-all">${closeSvg}</button>
                        </div>
                    </div>
                    ${res}
                </div>`;
            };
            sideList.innerHTML = historyData.filter(d => d.mode === '横').map(renderItem).join('') || '<p class="text-center text-[#d1d1d6] opacity-30 py-8 text-sm italic">履歴データはありません</p>';
            heightList.innerHTML = historyData.filter(d => d.mode === '縦').map(renderItem).join('') || '<p class="text-center text-[#d1d1d6] opacity-30 py-8 text-sm italic">履歴データはありません</p>';
        }

        function openConfirm(action, mode = '') {
            const modal = document.getElementById('customConfirmModal');
            window.pendingAction = { action, mode };
            const confirmMessage = document.getElementById('confirmMessage');
            confirmMessage.innerText = action === 'all' 
                ? "全ての履歴を一括削除しますか？\n（鍵マークの項目は保持されます）" 
                : `${mode}切込の履歴を削除しますか？\n（鍵マークの項目は保持されます）`;
            modal.classList.remove('hidden');
        }

        function executeConfirm() {
            const { action, mode } = window.pendingAction;
            const removedIds = new Set(historyData.filter(d => !d.checked && (action === 'all' || d.mode === mode)).map(d => d.id));
            historyData = historyData.filter(d => d.checked || (action !== 'all' && d.mode !== mode));
            
            if (activePreviewId && removedIds.has(activePreviewId)) {
                document.getElementById('sideHistoryPreviewContainer').classList.add('hidden');
                document.getElementById('heightHistoryPreviewContainer').classList.add('hidden');
                activePreviewId = null;
            }
            
            document.getElementById('customConfirmModal').classList.add('hidden');
            persist();
            renderHistory();
            updateHistoryCountBadge();
            showToast("削除が完了しました");
        }

        function updateSVG(type, p1, p2, p3, o1, o2, dir, targetId) {
            const container = document.getElementById(targetId);
            if (!container) return;
            if (type === 'side') {
                const l1 = p1, l2 = p2, a = p3, zVal = o1, yVal = o2;
                const scale = 320 / Math.max(4 * a, l2 * 2);
                const centerWorld = l1 + (l2 / 2);
                const winW = l2 * scale, winLE = 200 + (l1 - centerWorld) * scale, winRE = winLE + winW;
                let jointsHtml = "";
                let currentJX = winLE - (zVal * scale);
                while (currentJX > -50) { jointsHtml += `<line x1="${currentJX}" y1="15" x2="${currentJX}" y2="185" stroke="#666666" stroke-width="1.2" stroke-dasharray="5,4" />`; currentJX -= (a * scale); }
                currentJX = winRE + (yVal * scale);
                while (currentJX < 450) { jointsHtml += `<line x1="${currentJX}" y1="15" x2="${currentJX}" y2="185" stroke="#666666" stroke-width="1.2" stroke-dasharray="5,4" />`; currentJX += (a * scale); }
                currentJX = winLE - (zVal * scale) + (a * scale);
                while (currentJX < winRE) { if (currentJX > winLE + 1) jointsHtml += `<line x1="${currentJX}" y1="15" x2="${currentJX}" y2="185" stroke="#333333" stroke-width="1" stroke-dasharray="3,3" />`; currentJX += (a * scale); }
                const jLX = winLE - (zVal * scale), jRX = winRE + (yVal * scale);
                const dirX = dir === 'LtoR' ? 385 : 15, dirAnchor = dir === 'LtoR' ? 'end' : 'start';
                container.innerHTML = `<svg viewBox="0 0 400 200" class="w-full h-auto aspect-[2/1]"><rect x="5" y="5" width="390" height="190" fill="none" stroke="#d1d1d6" stroke-width="1" />${jointsHtml}<rect x="${winLE}" y="50" width="${winW}" height="80" fill="#1c1c1e" stroke="#ffffff" stroke-width="2.5" /><text x="${winLE + winW/2}" y="95" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">開口部</text><line x1="${winLE}" y1="155" x2="${jLX}" y2="155" stroke="#0a84ff" stroke-width="3" /><circle cx="${winLE}" cy="155" r="2.5" fill="#0a84ff" /><text x="${(winLE + jLX)/2}" y="182" text-anchor="middle" font-size="${zVal > 999 ? 20 : 26}" fill="#0a84ff" font-weight="600">${formatNumber(zVal)}</text><line x1="${winRE}" y1="155" x2="${jRX}" y2="155" stroke="#30d158" stroke-width="3" /><circle cx="${winRE}" cy="155" r="2.5" fill="#30d158" /><text x="${(winRE + jRX)/2}" y="182" text-anchor="middle" font-size="${yVal > 999 ? 20 : 26}" fill="#30d158" font-weight="600">${formatNumber(yVal)}</text><text x="${dirX}" y="30" text-anchor="${dirAnchor}" font-size="11" fill="#ff9f0a" font-weight="500">${dir === 'LtoR' ? '← 張出方向' : '張出方向 →'}</text><text x="${dirX}" y="95" text-anchor="${dirAnchor}" font-size="16" fill="#ffffff" font-weight="600">L1:${formatNumber(l1)}</text></svg>`;
            } else {
                const total = p1, l2 = p2, l1 = p3, rUp = o1, rTop = o2;
                const hS = 160 / total, wB = 185, wT = 25, winYB = wB - (l1 * hS), winH = l2 * hS, winYT = winYB - winH;
                container.innerHTML = `<svg viewBox="0 0 400 210" class="w-full h-auto aspect-[400/210]"><rect x="150" y="${wT}" width="100" height="${wB - wT}" fill="none" stroke="#d1d1d6" stroke-width="2" /><rect x="160" y="${winYT}" width="80" height="${winH}" fill="#1c1c1e" stroke="#ffffff" stroke-width="2.5" /><text x="200" y="${winYT + winH/2 + 5}" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">開口部</text><text x="200" y="${winYB + 25}" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="600">H:${formatNumber(l1)}</text><line x1="130" y1="${wB}" x2="130" y2="${winYB}" stroke="#ffffff" stroke-width="3" /><text x="120" y="${(wB + winYB)/2 + 8}" text-anchor="end" font-size="28" fill="#ffffff" font-weight="600">${formatNumber(l1)}</text><line x1="270" y1="${wB}" x2="270" y2="${winYT}" stroke="#5e5ce6" stroke-width="3" /><text x="280" y="${(wB + winYT)/2 + 8}" text-anchor="start" font-size="28" fill="#5e5ce6" font-weight="600">${formatNumber(rUp)}</text><line x1="130" y1="${winYT}" x2="130" y2="${wT}" stroke="#30d158" stroke-width="3" /><text x="120" y="${(winYT + wT)/2 + 8}" text-anchor="end" font-size="28" font-weight="600" style="fill: #30d158;">${formatNumber(rTop)}</text><text x="150" y="${wB + 15}" font-size="10" fill="#d1d1d6" font-weight="500">下端 0</text></svg>`;
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            if (t) { t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1200); }
        }

        let zoomState = { scale: 1, x: 0, y: 0, rotation: 0 };
        let pinchState = { isDragging: false, startX: 0, startY: 0, initialDist: 0, initialScale: 1 };

        function openZoomModal(sourceId) {
            const sourceEl = document.getElementById(sourceId);
            if (!sourceEl) return;
            const svgEl = sourceEl.querySelector('svg');
            if (!svgEl) return;

            const svgData = new XMLSerializer().serializeToString(svgEl);
            const svgUrl = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgData);

            const zoomImg = document.getElementById('zoomImg');
            zoomImg.src = svgUrl;
            
            zoomState = { scale: 1, x: 0, y: 0, rotation: 0 };
            updateZoomTransform();

            const modal = document.getElementById('zoomModal');
            modal.classList.remove('hidden');
        }

        function closeZoomModal() {
            const modal = document.getElementById('zoomModal');
            modal.classList.add('hidden');
            const zoomImg = document.getElementById('zoomImg');
            zoomImg.src = '';
        }

        function toggleZoomRotation() {
            const zoomImg = document.getElementById('zoomImg');
            zoomState.rotation = (zoomState.rotation === 0) ? 90 : 0;
            zoomState.x = 0;
            zoomState.y = 0;
            
            if (zoomState.rotation === 90) {
                const vW = window.innerWidth;
                const vH = window.innerHeight;
                const rect = zoomImg.getBoundingClientRect();
                const scaleW = (vW * 0.95) / rect.height;
                const scaleH = (vH * 0.95) / rect.width;
                zoomState.scale = Math.min(scaleW, scaleH);
            } else {
                zoomState.scale = 1;
            }
            
            zoomImg.style.transition = 'transform 0.3s ease-in-out';
            updateZoomTransform();
            setTimeout(() => { zoomImg.style.transition = 'none'; }, 300);
        }

        function updateZoomTransform() {
            const zoomImg = document.getElementById('zoomImg');
            zoomImg.style.transform = `translate(${zoomState.x}px, ${zoomState.y}px) scale(${zoomState.scale}) rotate(${zoomState.rotation}deg)`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const zoomArea = document.getElementById('zoomArea');
            if (!zoomArea) return;

            zoomArea.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    pinchState.isDragging = true;
                    pinchState.startX = e.touches[0].clientX - zoomState.x;
                    pinchState.startY = e.touches[0].clientY - zoomState.y;
                } else if (e.touches.length === 2) {
                    pinchState.isDragging = false;
                    pinchState.initialDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    pinchState.initialScale = zoomState.scale;
                }
            }, { passive: false });

            zoomArea.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (e.touches.length === 1 && pinchState.isDragging) {
                    zoomState.x = e.touches[0].clientX - pinchState.startX;
                    zoomState.y = e.touches[0].clientY - pinchState.startY;
                    updateZoomTransform();
                } else if (e.touches.length === 2) {
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    const scale = pinchState.initialScale * (dist / pinchState.initialDist);
                    zoomState.scale = Math.max(0.3, Math.min(scale, 10));
                    updateZoomTransform();
                }
            }, { passive: false });

            zoomArea.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) pinchState.initialDist = 0;
                if (e.touches.length === 0) pinchState.isDragging = false;
                else if (e.touches.length === 1) {
                    pinchState.isDragging = true;
                    pinchState.startX = e.touches[0].clientX - zoomState.x;
                    pinchState.startY = e.touches[0].clientY - zoomState.y;
                }
            });
        });

        window.onload = () => { hydrate(); refreshFocusedHighlights(); };
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const isSupportedProtocol = window.location.protocol === 'https:' || window.location.protocol === 'http:';
                const isBlobOrData = window.location.href.startsWith('blob:') || window.location.href.startsWith('data:');

                if (isSupportedProtocol && !isBlobOrData) {
                    try {
                        const swUrl = new URL('./sw.js', window.location.href).href;
                        navigator.serviceWorker.register(swUrl).then((registration) => {
                            console.log('ServiceWorker registered:', registration.scope);
                        }).catch(() => {});
                    } catch (e) {}
                }
            });
        }
    </script>
</body>
